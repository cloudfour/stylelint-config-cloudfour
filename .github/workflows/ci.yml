name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      - name: Run linter 👀
        run: npm run lint:check
      - name: Run tests 🧪
        run: npm test

  # Finds the oldest Node version each part of `engines.node` allows, for
  # example 20.19.0 from `>=20.19.0`, for the job below. It reads them from
  # package.json rather than listing them in the workflow, so Renovate doesn't
  # update them and changing `engines` is the only edit needed.
  oldest-node-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Read engines.node 📖
        id: read
        run: |
          versions="$(node --print '
            JSON.stringify(require("./package.json").engines.node.split("||").map((part) => {
              const match = /^(?:\^|~|>=)?\s*v?(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:\s|$)/.exec(part.trim());
              if (!match) throw new Error(`Can not find the oldest version in "${part.trim()}"`);
              return [match[1], match[2] ?? 0, match[3] ?? 0].join(".");
            }))
          ')"
          echo "Oldest supported Node versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # `ci` only ever sees the current Node and the stylelint in the lockfile, so
  # on its own it cannot tell us whether the ranges we advertise in `engines`
  # and `peerDependencies` are honest. This runs the tests on the oldest Node
  # and stylelint we claim to support, resolved from those ranges so it follows
  # whatever we declare. See CONTRIBUTING.md.
  test-oldest-supported:
    name: test-oldest-supported (Node ${{ matrix.node-version }})
    needs: oldest-node-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.oldest-node-versions.outputs.versions) }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      # Asks npm for the oldest published release in each peer range rather
      # than working it out from the range, which can name a version that was
      # never published. npm leaves prereleases out of range matches, so every
      # version here is a plain major.minor.patch.
      - name: Downgrade to the oldest supported peer dependencies ⬇️
        run: |
          specs="$(node --print '
            const { execFileSync } = require("node:child_process");
            const byVersion = (a, b) => {
              const [x, y] = [a, b].map((version) => version.split(".").map(Number));
              return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
            };
            Object.entries(require("./package.json").peerDependencies).map(([name, range]) => {
              const published = [JSON.parse(execFileSync("npm", ["view", `${name}@${range}`, "version", "--json"]))].flat();
              return `${name}@${published.sort(byVersion)[0]}`;
            }).join(" ")
          ')"
          echo "Testing against $specs"
          npm install --no-save $specs
      - name: Run tests 🧪
        run: npm test
